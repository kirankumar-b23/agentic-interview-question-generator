<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NxtMock — how a run actually works, step by step</title>
<!--
  Self-contained on purpose: no CDN, no fonts fetched, no build step. Open it by double-click, offline,
  or publish it as-is. Every step id below is a real `emit()` call in src/pipeline.py and every function
  named is a real function — the point is that a stuck run maps to a slide.
  Regenerate the funnel numbers with:  python3 scripts/yield_report.py
-->
<style>
  :root{
    --bg:#090c12; --surface:#11151f; --surface2:#161c28; --line:#232c3b; --line2:#303c50;
    --text:#e9eef6; --dim:#a4b0c4; --faint:#677488;
    --accent:#4d8df6; --accent2:#46d6cf; --ok:#43c98a; --warn:#e3b341; --bad:#f2705b;
    --mono: ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;
    --serif: 'Iowan Old Style',Georgia,'Times New Roman',serif;
    --sans: -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f3f6fb; --surface:#fff; --surface2:#eef2f8; --line:#d8e0ec; --line2:#c2cddd;
           --text:#141a24; --dim:#48526a; --faint:#79849a; --accent:#2f6fe0; --accent2:#11a99f;
           --ok:#1f9d62; --warn:#b07d12; --bad:#d6452f; }
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.6;
       min-height:100vh;display:flex;flex-direction:column}
  header{border-bottom:1px solid var(--line);padding:18px 28px 0;flex-shrink:0}
  .brand{font-family:var(--serif);font-size:1.7rem;line-height:1.1}
  .brand em{font-style:normal;color:var(--accent)}
  .sub{font-family:var(--mono);font-size:.7rem;color:var(--faint);letter-spacing:.14em;
       text-transform:uppercase;margin-top:6px}
  /* Step rail — also a jump control. Wide content must never push the page sideways. */
  .rail{display:flex;gap:2px;overflow-x:auto;margin-top:16px;padding-bottom:2px}
  .rail button{flex:0 0 auto;background:none;border:0;font:inherit;color:var(--faint);cursor:pointer;
       font-family:var(--mono);font-size:.66rem;padding:7px 9px;border-bottom:2px solid transparent;
       white-space:nowrap}
  .rail button:hover{color:var(--text)}
  .rail button[aria-current="true"]{color:var(--accent);border-bottom-color:var(--accent)}
  main{flex:1;padding:26px 28px;max-width:1180px;width:100%;margin:0 auto}
  .stepno{font-family:var(--mono);font-size:.72rem;color:var(--faint);letter-spacing:.16em}
  h2{font-family:var(--serif);font-size:2.1rem;font-weight:400;line-height:1.15;margin:4px 0 6px}
  .who{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:.68rem;
       text-transform:uppercase;letter-spacing:.1em;background:var(--surface2);border:1px solid var(--line2);
       border-radius:999px;padding:3px 11px;color:var(--dim);margin-bottom:18px}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:820px){ .grid{grid-template-columns:1fr} h2{font-size:1.6rem} main{padding:20px 16px} }
  .card{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:15px 17px}
  .card.wide{grid-column:1/-1}
  .lbl{font-family:var(--mono);font-size:.63rem;letter-spacing:.15em;text-transform:uppercase;
       color:var(--faint);margin-bottom:8px}
  .card p{font-size:.94rem;color:var(--dim)}
  .card p strong{color:var(--text);font-weight:600}
  code{font-family:var(--mono);font-size:.82em;background:var(--surface2);border:1px solid var(--line);
       border-radius:4px;padding:1px 5px;color:var(--text)}
  .flow{font-family:var(--mono);font-size:.84rem;color:var(--text);display:flex;flex-wrap:wrap;
        align-items:center;gap:8px}
  .flow span.arrow{color:var(--accent)}
  ul{list-style:none;display:flex;flex-direction:column;gap:8px}
  li{font-size:.9rem;color:var(--dim);padding-left:15px;position:relative}
  li::before{content:'';position:absolute;left:0;top:.62em;width:5px;height:5px;border-radius:50%;
             background:var(--bad);opacity:.85}
  .card.check li::before{background:var(--ok)}
  .card.risk{border-left:2px solid var(--bad)}
  .card.check{border-left:2px solid var(--ok)}
  /* Funnel table on the last-but-one slide */
  table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:.78rem;margin-top:4px}
  th{text-align:left;color:var(--faint);font-weight:500;padding:5px 8px;border-bottom:1px solid var(--line2);
     font-size:.66rem;letter-spacing:.1em;text-transform:uppercase}
  td{padding:6px 8px;border-bottom:1px solid var(--line);color:var(--dim)}
  td.n{text-align:right;color:var(--text)}
  tr.good td.v{color:var(--ok)} tr.bad td.v{color:var(--bad)}
  footer{border-top:1px solid var(--line);padding:14px 28px;display:flex;align-items:center;
         justify-content:space-between;gap:14px;flex-shrink:0;background:var(--surface)}
  .nav{display:flex;gap:8px}
  .nav button{font:inherit;font-size:.86rem;font-weight:600;padding:8px 17px;border-radius:7px;
      border:1px solid var(--line2);background:var(--surface2);color:var(--text);cursor:pointer}
  .nav button:hover:not(:disabled){border-color:var(--accent)}
  .nav button:disabled{opacity:.4;cursor:not-allowed}
  .nav button.primary{background:var(--accent);border-color:var(--accent);color:#06121f}
  .hint{font-family:var(--mono);font-size:.68rem;color:var(--faint)}
  @media print{ .rail,footer{display:none} .step{display:block!important;page-break-after:always} }
</style>
</head>
<body>

<header>
  <div class="brand">NxtMock — <em>how a run actually works</em></div>
  <div class="sub">13 steps · every step id is a real SSE event · built from the code, not from memory</div>
  <nav class="rail" id="rail" aria-label="Jump to step"></nav>
</header>

<main id="stage" aria-live="polite"></main>

<footer>
  <div class="hint" id="counter"></div>
  <div class="nav">
    <button id="prev">← Back</button>
    <button id="next" class="primary">Next →</button>
  </div>
  <div class="hint">use ← → keys</div>
</footer>

<script>

  check:["<code>result.context.interview_topics</code> vs <code>learning_outcomes</code> — coverage is scored against the former.",

 },
 {
  tag:"2 Retrieve", n:"STEP 03", title:"Retrieval agent gathers real questions",

  check:["Count <code>result.removed[].stage == \"session_fit\"</code>.",

const FUNNEL = [
  {run:"2048e1f9", raw:"1,554", pool:"270", fit:"—", pre:"—", rel:"—", fin:"5", v:"approved", cls:"good"},
  {run:"62e3578d", raw:"1,834", pool:"270", fit:"169", pre:"54", rel:"42", fin:"3", v:"fail", cls:"bad"},
  {run:"5d1d5d58", raw:"1,920", pool:"270", fit:"140", pre:"80", rel:"78", fin:"7", v:"pass", cls:"good"}
];

const stage=document.getElementById('stage'), rail=document.getElementById('rail'),
      prev=document.getElementById('prev'), next=document.getElementById('next'),
      counter=document.getElementById('counter');
let i=0;

STEPS.forEach((s,idx)=>{
  const b=document.createElement('button');
  b.textContent=s.tag; b.onclick=()=>go(idx); rail.appendChild(b);
});

function funnelTable(){
  return `<div class="card wide"><div class="lbl">Real runs — same topic, three attempts</div>
    <div style="overflow-x:auto"><table>
      <tr><th>run</th><th>raw</th><th>pool</th><th>−fit</th><th>−pre</th><th>−rel</th><th>FINAL</th><th>verdict</th></tr>
      ${FUNNEL.map(f=>`<tr class="${f.cls}"><td>${f.run}</td><td class="n">${f.raw}</td><td class="n">${f.pool}</td>
        <td class="n">${f.fit}</td><td class="n">${f.pre}</td><td class="n">${f.rel}</td>
        <td class="n"><strong>${f.fin}</strong></td><td class="v">${f.v}</td></tr>`).join('')}
    </table></div>
    <p style="margin-top:10px">Same topic, same settings. The middle row is what a broken keyword floor plus an
    over-eager clause trimmer cost; the last row is after fixing both and adding the open-web top-up.</p></div>`;
}

function render(){
  const s=STEPS[i];
  stage.innerHTML=`
    <div class="stepno">${s.n}</div>
    <h2>${s.title}</h2>
    <div class="who"><span class="dot"></span>${s.who}</div>
    <div class="grid">
      <div class="card wide"><div class="lbl">What happens</div><p>${s.does}</p></div>
      <div class="card wide"><div class="lbl">In → out</div>
        <div class="flow">${s.flow.map((f,k)=>(k?'<span class="arrow">→</span>':'')+`<span>${f}</span>`).join('')}</div></div>
      <div class="card"><div class="lbl">Code</div><p>${s.code}</p></div>
      <div class="card"><div class="lbl">Live step id (SSE)</div><p>${s.sse}</p></div>
      ${s.table?funnelTable():''}
      <div class="card risk"><div class="lbl">What goes wrong here</div><ul>${s.wrong.map(w=>`<li>${w}</li>`).join('')}</ul></div>
      <div class="card check"><div class="lbl">How to check it</div><ul>${s.check.map(c=>`<li>${c}</li>`).join('')}</ul></div>
    </div>`;
  [...rail.children].forEach((b,k)=>b.setAttribute('aria-current', k===i?'true':'false'));
  rail.children[i].scrollIntoView({block:'nearest',inline:'nearest'});
  prev.disabled=(i===0); next.disabled=(i===STEPS.length-1);
  next.textContent = i===STEPS.length-1 ? 'End' : 'Next →';
  counter.textContent=`step ${i+1} of ${STEPS.length}`;
  window.scrollTo({top:0});
}
function go(n){ i=Math.max(0,Math.min(STEPS.length-1,n)); render(); }
prev.onclick=()=>go(i-1); next.onclick=()=>go(i+1);
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' ') { e.preventDefault(); go(i+1); }
  if(e.key==='ArrowLeft') { e.preventDefault(); go(i-1); }
  if(e.key==='Home') go(0);
  if(e.key==='End') go(STEPS.length-1);
});
render();
</script>
</body>
</html>
